services:
  - type: web
    name: codex-auth-m365-beta
    runtime: docker
    plan: free
    healthCheckPath: /
    autoDeployTrigger: off
    envVars:
      - key: CODEX_AUTH_BETA_MODE
        value: "1"
      - key: CODEX_AUTH_M365_BETA_AUTH_JSON
        sync: false
      - key: CODEX_AUTH_M365_BETA_API_KEY
        generateValue: true
      - key: CODEX_AUTH_M365_BETA_ADMIN_KEY
        generateValue: true
      - key: CODEX_AUTH_M365_BETA_CONVERSATION_HMAC_KEY
        generateValue: true
      - key: CODEX_AUTH_M365_BETA_DASHBOARD_SESSION_KEY
        generateValue: true
      - key: CODEX_AUTH_M365_BETA_DATABASE_URL
        sync: false
      - key: CODEX_AUTH_M365_BETA_CREDENTIAL_KEY
        sync: false
      - key: CODEX_AUTH_M365_BETA_OAUTH_CLIENT_ID
        sync: false
      - key: CODEX_AUTH_M365_BETA_OAUTH_CLIENT_SECRET
        sync: false
      - key: CODEX_AUTH_M365_BETA_OAUTH_TENANT
        value: "common"
      - key: CODEX_AUTH_M365_BETA_OAUTH_REDIRECT_URI
        sync: false
      - key: CODEX_AUTH_M365_BETA_OAUTH_SYDNEY_SCOPE
        value: "https://substrate.office.com/sydney/v2/.default openid profile offline_access"
      - key: CODEX_AUTH_M365_BETA_OAUTH_GRAPH_SCOPE
        value: "https://graph.microsoft.com/.default openid profile offline_access"
