name: Publish and Release

on:
  release:
    types: [published]

permissions:
  contents: write # Needed to upload to GitHub Releases
  id-token: write # Needed for trusted publishing to PyPI

jobs:
  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        run: pip install build

      - name: Build Wheel and sdist
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PyPI Trusted Publishing uses OIDC, no password required!
          skip-existing: true

  build-exe:
    name: Build Standalone Windows .exe
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --onefile `
            --name codex-auth `
            --add-data "src\codex_auth\web\templates;codex_auth\web\templates" `
            src/codex_auth/cli.py
        shell: powershell

      - name: Upload .exe to Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/codex-auth.exe
