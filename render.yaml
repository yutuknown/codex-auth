services:
  - type: web
    name: codex-auth
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: CODEX_AUTH_COOKIES
        sync: false
      - key: CODEX_AUTH_API_KEY
        generateValue: true
      - key: CODEX_AUTH_OPEN_DASHBOARD
        value: "false"
