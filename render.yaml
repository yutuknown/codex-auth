services:
  - type: web
    name: codex-auth
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: CODEX_AUTH_COOKIES
        sync: false
      - key: CODEX_AUTH_ACCESS_TOKEN
        sync: false
      - key: CODEX_AUTH_M365_COOKIES
        sync: false
      - key: CODEX_AUTH_M365_AUTH_JSON
        sync: false
      - key: CODEX_AUTH_M365_OAUTH_JSON
        sync: false
      - key: CODEX_AUTH_API_KEY
        generateValue: true
      - key: CODEX_AUTH_OPEN_DASHBOARD
        value: "false"
